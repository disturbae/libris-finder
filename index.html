<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LibrisFinder: search any book and jump straight to where you can buy it.">
  <meta name="theme-color" content="#1f3a5f">
  <title>LibrisFinder – Find it. Buy it.</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="hero">
    <h1 class="hero__logo">Libris<span>Finder</span></h1>
    <p class="hero__tagline">Search any book. Go straight to checkout.</p>
    <form class="search" id="search-form" role="search">
      <label class="search__label" for="q">Search books</label>
      <input class="search__input" id="q" name="q" type="search" autocomplete="off"
             placeholder="Title, author or ISBN…" required minlength="2">
      <button class="search__btn" type="submit">Search</button>
    </form>
  </header>

  <main class="container">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <section class="grid" id="results" aria-label="Search results"></section>
    <button class="more" id="more" type="button" hidden>Load more</button>
  </main>

  <template id="card-tpl">
    <article class="card">
      <div class="card__media">
        <img class="card__img" loading="lazy" decoding="async" width="128" height="192" alt="">
      </div>
      <div class="card__body">
        <h2 class="card__title"></h2>
        <p class="card__author"></p>
        <p class="card__meta"></p>
        <p class="card__price" hidden></p>
        <ul class="card__links"></ul>
      </div>
    </article>
  </template>
</body>
</html>
